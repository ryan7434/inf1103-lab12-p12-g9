name: tests

# CI: every branch push and every pull request into main runs the tests.
# CD: pushing a version tag such as v1.0.0 runs the tests again and, only if they
#     pass, builds the Docker image and publishes it to GitHub Container Registry.
on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -p "test_*.py" -v

      # Only runs while the old pytest-style file still exists.
      # Once it is renamed to test_logic_manager.py (unittest style), the step above covers it.
      - name: Run logic manager tests (pytest style)
        if: hashFiles('logic_manager_testing.py') != ''
        run: |
          pip install pytest
          python -m pytest -q logic_manager_testing.py

      - name: Build Docker image
        run: docker build -t inf1103-p12-g9 .

      - name: Run the tests inside Docker, offline
        run: docker run --rm --network none inf1103-p12-g9 python -m unittest discover -p "test_*.py" -v

  publish:
    # Release: runs only for version tags, and only after the test job has passed.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag looks like vMAJOR.MINOR.PATCH
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not in the form v1.2.3. Nothing will be published."
            exit 1
          fi

      - name: Set image name and version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/inf1103-p12-g9" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t release-candidate .
          docker image ls release-candidate

      - name: Run the tests inside the release image, offline
        run: docker run --rm --network none release-candidate python -m unittest discover -p "test_*.py" -v

      - name: Check that no API key is baked into the image
        run: |
          if docker run --rm release-candidate env | grep -q "GEMINI_API_KEY"; then
            echo "GEMINI_API_KEY is set inside the image. Remove it from the Dockerfile."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push versioned image and latest
        run: |
          docker tag release-candidate "$IMAGE:$VERSION"
          docker tag release-candidate "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"